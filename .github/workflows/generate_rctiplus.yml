name: Generate RCTI+ Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate_rctiplus.yml'
      - 'generate_rctiplus.py'
      - 'merge_playlists.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: git-write-lock
  cancel-in-progress: false

jobs:
  build-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p playlists

      - name: Generate RCTI+ Playlists
        env:
          RCTIPLUS_API_KEY: ${{ secrets.RCTIPLUS_API_KEY }}
          RCTIPLUS_API_URL: ${{ secrets.RCTIPLUS_API_URL }}
          RCTIPLUS_FALLBACK_TOKEN: ${{ secrets.RCTIPLUS_FALLBACK_TOKEN }}
        run: python generate_rctiplus.py

      - name: Merge to IndihomeTV.m3u
        run: python merge_playlists.py
          
      - name: Commit and Push (Keep History Clean)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A playlists/
          git add IndihomeTV.m3u

          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          LAST_MSG=$(git log -1 --format='%s')
          
          if [[ "$LAST_MSG" == Auto-Update* ]]; then
            echo "Last commit by bot. Amending..."
            git commit --amend --no-edit --date="$TIMESTAMP"
            git push origin main --force-with-lease
          else
            echo "Creating new commit..."
            git commit -m "Auto-Update $TIMESTAMP"
            git push origin main
          fi